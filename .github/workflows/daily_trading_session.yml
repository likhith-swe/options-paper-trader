name: Daily Market Paper Trading Session

on:
  schedule:
    # 10:15 UTC = 15:45 IST (Mon-Fri, 15 mins after Indian market close)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  trade-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Market Trading Session
        env:
          TZ: 'Asia/Kolkata'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py run-today

      - name: Commit & Push Updated Paper Trading Ledger
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_trader.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(ledger): reconcile daily paper trading session [skip ci]"
            git push
          fi
