services:
  - type: web
    name: options-paper-trader-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run reporting/dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Kolkata
